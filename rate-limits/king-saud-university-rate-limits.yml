specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: King Saud University
providerId: king-saud-university
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  King Saud University publishes no rate-limit policy for any of its surfaces. The
  Open Data distributions at data.ksu.edu.sa are static files served by Drupal; 20
  consecutive anonymous requests on 2026-09-01, including two multi-megabyte JSON
  fetches, all returned HTTP 200 with no throttling headers, no Retry-After and no
  429. The identity plane at iam.ksu.edu.sa publishes no documented limits either.
  Absence of an observed limit is not a guarantee of an unlimited service — treat
  bulk retrieval politely and cache, since these datasets are refreshed annually.
notes: >-
  Corrected 2026-09-01. The previous version of this file referenced OAI-PMH and
  IIIF harvesting endpoints; King Saud University operates neither. Its only
  former OAI-PMH endpoint, at repository.ksu.edu.sa, is NXDOMAIN.
method: probed
sources:
- https://data.ksu.edu.sa/ar/api/guide
- https://raw.githubusercontent.com/api-evangelist/king-saud-university/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Open Data distributions
  scope: client
  metric: requests
  limit: none observed
  notes: >-
    No published limit and none observed. Probed 2026-09-01 across 20 files with
    no throttling response.
- name: Identity plane
  scope: client
  metric: requests
  limit: not published
  notes: >-
    iam.ksu.edu.sa publishes no rate-limit documentation. Endpoints are not
    self-service, so limits would be set per issued client.
policies:
- name: Backoff Strategy
  description: >-
    No provider policy exists. Recommended client practice only: exponential
    backoff with jitter, honour any Retry-After, and cache annually-refreshed
    datasets rather than re-fetching.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
