reviews:
  - date: '2026-09-01'
    rating: 3
    summary: >-
      The 2026-06-03 finding of "no public API" is WITHDRAWN as wrong. King Saud
      University operates two public, machine-readable, institution-owned surfaces;
      both were missed because every piece of guidance for them exists only in
      Arabic. (1) The KSU Data Management Office runs an open-data programme at
      data.ksu.edu.sa — 852 dataset distribution files across seven families in
      JSON, XML, RDF/XML, CSV and XLSX, entirely unauthenticated, under a
      KSU-authored open-data licence, on a declared annual cadence, documented by
      an Arabic API guide and a 13-page reference PDF. 20 of 20 sampled files
      returned HTTP 200; the 1444 AH employee dataset returned 11,709 records.
      Note that data.ksu.edu.sa/en/api/guide is a 404 while
      data.ksu.edu.sa/ar/api/guide is a 200 — the language barrier IS the finding.
      (2) The university runs its own OAuth 2.0 / OpenID Connect / SAML identity
      plane at iam.ksu.edu.sa, serving a full OIDC discovery document, RFC 8414
      authorization-server metadata and a live JWKS anonymously, with PKCE, PAR,
      CIBA, device grant, introspection and revocation all advertised. Its SAML
      identity provider is registered in eduGAIN by the Saudi Maeen federation.
      Three relationships were recorded rather than credited as contracts (eduGAIN
      via Maeen, Crossref member 19827 / prefix 10.33948, ROR 02f81g417) and one
      tenancy was recorded without saving the vendor's contract (lms.ksu.edu.sa is
      a CNAME to ksu.blackboard.com, Anthology Blackboard Learn SaaS). What KSU
      genuinely lacks is a developer programme: no portal, no English reference, no
      OpenAPI, no apis.json, no llms.txt, no agent card, no status page, and an
      advertised OAuth client-registration endpoint that answers 404. A Figshare
      tenancy was tested and rejected — ksu.figshare.com returns an AWS WAF
      challenge, but so does a control request to a nonexistent subdomain.
