apis:
  - aid: king-saud-university:open-data
    name: KSU Open Data Distribution API
    x-operator: institution
    x-operator-basis: >-
      data.ksu.edu.sa is under the institution's own registrable domain; the
      portal names its publisher as the King Saud University Data Management
      Office and the licence names King Saud University as licensor.
    description: >-
      The King Saud University Data Management Office (مكتب إدارة البيانات)
      publishes institutional open data as stable, unauthenticated HTTP resources
      on the university's own domain. Seven dataset families — enrolled students
      and graduates, faculty, administrative and technical staff, outbound
      scholarships, scientific research (publications, awards and patents,
      research chairs and scholarly associations, library holdings), student
      services and activities, and community service including the University
      Medical City — each released in five formats: JSON, XML, RDF/XML, CSV and
      XLSX. 852 distribution files are linked from the portal's category pages
      (219 RDF, 216 XLSX, 213 CSV, 103 JSON, 101 XML); 202 dataset names are
      enumerated in the university's own reference PDF. Coverage runs from Hijri
      year 1430/1431 AH to 1444 AH and on into Gregorian 2023-2025, on a declared
      annual cadence. Verified live 2026-09-01: 20 of 20 sampled files returned
      HTTP 200 with the correct content type, and the 1444 AH employee dataset
      returned 11,709 records. The university additionally documents a filtered
      query endpoint at GET /api/views/data_api; that route is dead, returning
      {"message":"No route found for \"GET /api/views/data_api\""}, and it is
      therefore not described in the OpenAPI.
    humanURL: https://data.ksu.edu.sa/ar
    baseURL: https://data.ksu.edu.sa
