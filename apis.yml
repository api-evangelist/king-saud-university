x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated, machine-readable surfaces were found, fetched and
    described: the KSU Open Data distribution programme at data.ksu.edu.sa (852
    files, five formats, unauthenticated, 20 of 20 sampled files live) and the
    university's own OAuth 2.0 / OpenID Connect / SAML identity plane at
    iam.ksu.edu.sa (discovery documents and JWKS all served anonymously). Both
    were missed by the 2026-06-03 review because every piece of guidance for them
    is Arabic-only — data.ksu.edu.sa/en/api/guide is a 404 while
    data.ksu.edu.sa/ar/api/guide is a 200. Three relationships were recorded
    rather than credited as contracts: eduGAIN/Maeen federation membership,
    Crossref membership with prefix 10.33948, and a ROR identifier. One tenancy
    was recorded and its contract deliberately not saved: lms.ksu.edu.sa is a
    CNAME to ksu.blackboard.com (Anthology Blackboard Learn SaaS). Three claimed
    surfaces are dead and are not carried as pointers: the DSpace repository and
    its OAI-PMH endpoint at repository.ksu.edu.sa (NXDOMAIN, though ROAR still
    lists it), the library catalogue at catalog.library.ksu.edu.sa (resolves, TCP
    connection fails), and edugate.ksu.edu.sa (timed out on three consecutive
    attempts, having returned 200 in June). One Figshare false positive was
    tested and rejected: ksu.figshare.com answers HTTP 202 with an AWS WAF
    challenge, but so does a control request to a deliberately nonexistent
    subdomain, so it is not evidence of a KSU tenancy and none is recorded. What
    the university genuinely lacks is a developer programme — no portal, no
    English documentation, no OpenAPI, no apis.json, no llms.txt, no agent card,
    no status page, and an advertised OAuth client-registration endpoint that
    answers 404.
