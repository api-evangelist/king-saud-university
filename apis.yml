    name: KSU learning management system (Blackboard Learn SaaS tenancy)
    x-operator: tenant
    x-operator-basis: >-
      lms.ksu.edu.sa is a CNAME to ksu.blackboard.com, which resolves onward into
      Anthology's Blackboard Learn SaaS estate
      (learn.6933129eab8d1.euc1.prod-01.core.blackboard.com). The hostname is the
      university's; the platform and its contract are Anthology's.
    description: >-
      King Saud University's learning management system is a Blackboard Learn SaaS
      tenancy fronted by a university hostname. Requesting it returns a SAML
      AuthnRequest to the university's own identity provider, which makes the
      tenancy genuine and the identity institution-operated. No contract is saved
      here: any API, LTI capability or specification for this platform is
      Anthology's engineering, not KSU's, and belongs to Anthology's own profile.
      Recorded because a tenancy is a real institutional fact and one of the few
      programmable surfaces most universities have.
    humanURL: https://lms.ksu.edu.sa/
