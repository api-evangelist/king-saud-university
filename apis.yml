aid: king-saud-university
name: King Saud University
description: >-
  King Saud University (جامعة الملك سعود, KSU) is Saudi Arabia's oldest public
  research university, founded in Riyadh in 1957. Contrary to the 2026-06-03
  review of this profile, KSU does operate public, machine-readable surfaces on
  its own domain — they are documented only in Arabic, which is why an
  English-language review missed them. Its Data Management Office publishes an
  institutional open-data programme at data.ksu.edu.sa: 852 dataset distribution
  files across seven dataset families in JSON, XML, RDF/XML, CSV and XLSX,
  unauthenticated, under a KSU-authored open-data licence, on a declared annual
  cadence, with an Arabic API guide and a 13-page reference PDF. Separately, the
  university runs its own identity plane at iam.ksu.edu.sa, which serves a public
  OpenID Connect discovery document and RFC 8414 authorization-server metadata,
  and whose SAML 2.0 identity provider is registered in eduGAIN through the Saudi
  Maeen Identity Federation. What KSU does NOT publish is a developer programme:
  there is no developer portal, no API reference in English, no OpenAPI, no
  apis.json, no llms.txt, no status page and no self-service client registration —
  the advertised OAuth registration endpoint answers 404. The filtered open-data
  query API the university still documents has been withdrawn from its own router.
  Everything else students and staff touch — Edugate, MyKSU, the Blackboard LMS,
  the library catalogue — is either a gated end-user application or a vendor
  platform running under a KSU hostname.
