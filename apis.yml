  - aid: king-saud-university:identity
    name: KSU Identity and Access Management (OAuth 2.0 / OpenID Connect / SAML 2.0)
    x-operator: institution
    x-operator-basis: >-
      iam.ksu.edu.sa is under the institution's own registrable domain, the
      discovery document's issuer is https://iam.ksu.edu.sa, and the SAML entity
      it fronts is registered to King Saud University with the ksu.edu.sa scope.
    description: >-
      King Saud University operates its own authorization server and identity
      provider, and publishes both discovery documents anonymously: OpenID Connect
      Discovery 1.0 at /.well-known/openid-configuration and RFC 8414
      authorization-server metadata at /.well-known/oauth-authorization-server,
      with a live JWKS at /pf/JWKS. The deployment is PingFederate and advertises
      authorization code with PKCE (S256), client credentials, refresh token, JWT
      and SAML2 bearer, token exchange, device code (RFC 8628), CIBA, pushed
      authorization requests (RFC 9126), introspection (RFC 7662), revocation (RFC
      7009) and both front- and back-channel logout. Six scopes are declared —
      openid, profile, email, eportalclaims, eportalWebScope and NoClaim — and the
      claim set exposes the university's directory attributes plus a StudentName
      claim. The same deployment answers SP-initiated SAML SSO: requesting
      lms.ksu.edu.sa returns a SAML AuthnRequest posted to
      iam.ksu.edu.sa/idp/startSSO.ping. Discoverable is not open: the advertised
      client registration endpoint returns 404 to an anonymous request, and the
      university publishes no documentation for this surface at all.
    humanURL: https://iam.ksu.edu.sa/.well-known/openid-configuration
    baseURL: https://iam.ksu.edu.sa
    tags: [ Identity, Authentication, OAuth 2.0, OpenID Connect, SAML, Single Sign-On, Not Self-Service ]
    properties:
      - type: OpenAPI
        url: openapi/king-saud-university-identity-openapi.yml
      - type: OpenIDConnectDiscovery
        url: https://iam.ksu.edu.sa/.well-known/openid-configuration
      - type: AuthorizationServerMetadata
        url: https://iam.ksu.edu.sa/.well-known/oauth-authorization-server
      - type: JWKS
        url: https://iam.ksu.edu.sa/pf/JWKS
      - type: Authentication
        url: authentication/king-saud-university-authentication.yml
      - type: Scopes
        url: scopes/king-saud-university-scopes.yml
  - aid: king-saud-university:edugain-idp
    name: King Saud University identity provider in eduGAIN (via Maeen)
    x-operator: federation
    x-operator-basis: >-
      A federation aggregate is shared by definition; the identity provider whose
      metadata it carries is King Saud University's own.
    description: >-
      King Saud University's SAML 2.0 identity provider is published into the
      eduGAIN interfederation metadata by the Maeen Identity Federation
      (https://www.maeen.sa, federation code SA-MIF, an eduGAIN member since
      2019-07-02). The entity is entityID
      http://SSO.ksu.edu.sa/adfs/services/trust, role IDPSSODescriptor, English
      display name "King Saud University", scope ksu.edu.sa, first seen in eduGAIN
      on 2020-02-02. The metadata itself lives in the eduGAIN aggregate at
      https://mds.edugain.org/edugain-v2.xml, served as
      application/samlmetadata+xml. This is a machine-readable, institution-owned
      identity surface — one of the strongest a university has, and the class this
      cohort was most completely missing. The entityID retains an ADFS-shaped
      identifier from before the university's migration to PingFederate, which is
      correct practice: a SAML entityID is a name, not a location.
    humanURL: https://technical.edugain.org/entities?id=671188
    tags: [ Identity Federation, eduGAIN, SAML, Shibboleth Metadata, Maeen, Saudi Arabia ]
    properties:
      - type: IdentityFederation
        url: https://technical.edugain.org/entities?id=671188
      - type: Metadata
        url: https://mds.edugain.org/edugain-v2.xml
      - type: RegistrationAuthority
        url: https://www.maeen.sa/
      - type: Conformance
        url: conformance/king-saud-university-conformance.yml
