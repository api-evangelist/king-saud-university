description: >-
  King Saud University is a non-commercial public institution and sells nothing
  programmable. Its Open Data distribution surface at data.ksu.edu.sa is free and
  entirely unauthenticated — no account, key or registration — and is governed by
  the KSU Open Data Licence, which grants use "to all persons without
  discrimination or charge" in return for source attribution. Its identity plane
  at iam.ksu.edu.sa is also free, but it is not self-service: the OAuth client
  registration endpoint it advertises returned HTTP 404 to an anonymous request on
  2026-09-01, so a client must be issued by the university.
notes: >-
  No commercial pricing of any kind. "Free / Open" is the open-data surface, which
  needs no credential at all; "Affiliation / Credentialed" is the identity plane
  and the gated end-user applications, where access is granted by institutional
  relationship rather than payment. Verified by live probe 2026-09-01.
method: probed
sources:
