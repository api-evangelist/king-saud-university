plans:
- id: king-saud-university-free-open
  name: Free / Open
  type: free
  description: The KSU Open Data distribution files at data.ksu.edu.sa — JSON, XML, RDF/XML, CSV and XLSX — served anonymously at no charge under the KSU Open Data Licence.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: king-saud-university-affiliation
  name: Affiliation / Credentialed
  type: free
  description: The OAuth 2.0 / OpenID Connect / SAML identity plane at iam.ksu.edu.sa and the gated end-user applications behind it, where a client or account is issued by the university rather than bought.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
